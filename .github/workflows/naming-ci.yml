name: Session Naming checks
on:
  pull_request:
    paths:
      - 'naming.html'
      - 'extensions/chatgpt-namer/**'
      - 'tests/naming.test.mjs'
      - '.github/workflows/naming-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  naming:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/naming.test.mjs
      - run: |
          node --check extensions/chatgpt-namer/content.js
          node --check extensions/chatgpt-namer/popup.js
