name: Deploy Session Deck to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - app.js
      - motion.js
      - motion.css
      - portfolio.html
      - portfolio-ui.css
      - portfolio-ui.js
      - portfolio-polish.css
      - portfolio-shortcuts.js
      - scripts/collect_portfolio.py
      - scripts/scan_repo_hygiene.py
      - scripts/validate_private_event.py
      - tests/test_validate_private_event.py
      - tests/test_repo_hygiene.py
      - docs/REPO_HYGIENE_DECISIONS.json
      - repo-hygiene-ui.js
      - tests/test_collect_portfolio.py
      - docs/APP_PORTFOLIO.md
      - docs/PORTFOLIO_REVIEW_CHECKPOINTS.json
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:
  schedule:
    # Every Monday at 10:17 Asia/Tokyo (01:17 UTC); scheduling can be delayed.
    - cron: '17 1 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish static demo
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Stage public demo assets only
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html styles.css app.js motion.css motion.js portfolio.html portfolio-ui.css portfolio-ui.js portfolio-polish.css portfolio-shortcuts.js repo-hygiene-ui.js _site/
          mkdir -p _site/docs
          cp docs/APP_PORTFOLIO.md _site/docs/
          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/app.js
          test -s _site/motion.js
          test -s _site/motion.css
          test -s _site/portfolio.html
          test -s _site/portfolio-ui.css
          test -s _site/portfolio-ui.js
          test -s _site/portfolio-polish.css
          test -s _site/portfolio-shortcuts.js
          test -s _site/repo-hygiene-ui.js
          test -s _site/docs/APP_PORTFOLIO.md
          touch _site/.nojekyll

      - name: Run offline public observer tests
        run: python3 -m unittest discover -s tests -p 'test_collect_portfolio.py' -v

      - name: Collect only public GitHub metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/collect_portfolio.py \
            --ledger docs/APP_PORTFOLIO.md \
            --output _site/data/portfolio-observations.json
          test -s _site/data/portfolio-observations.json

      - name: Validate public hygiene scan offline
        run: python3 -m unittest discover -s tests -p 'test_repo_hygiene.py' -v

      - name: Scan only explicitly public owned repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/scan_repo_hygiene.py \
            --ledger docs/APP_PORTFOLIO.md \
            --decisions docs/REPO_HYGIENE_DECISIONS.json \
            --output _site/data/repo-hygiene.json
          test -s _site/data/repo-hygiene.json

      - name: Run offline private event schema tests
        run: python3 -m unittest discover -s tests -p 'test_validate_private_event.py' -v

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
