name: Deploy Session Deck to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - app.js
      - portfolio.html
      - docs/APP_PORTFOLIO.md
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish static demo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Stage public demo assets only
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html styles.css app.js portfolio.html _site/
          mkdir -p _site/docs
          cp docs/APP_PORTFOLIO.md _site/docs/
          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/app.js
          test -s _site/portfolio.html
          test -s _site/docs/APP_PORTFOLIO.md
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
