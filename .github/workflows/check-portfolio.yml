name: Validate portfolio review queue

on:
  pull_request:
    paths:
      - 'scripts/collect_portfolio.py'
      - 'tests/test_collect_portfolio.py'
      - 'docs/APP_PORTFOLIO.md'
      - 'docs/PORTFOLIO_REVIEW_CHECKPOINTS.json'
      - 'portfolio.html'
      - 'docs/REPO_HYGIENE_20261017.md'
      - 'docs/CLOUD_SESSION_PROTOCOL.md'
      - 'portfolio-ui.css'
      - 'portfolio-ui.js'
      - 'repo-hygiene-ui.js'
      - 'scripts/scan_repo_hygiene.py'
      - 'tests/test_repo_hygiene.py'
      - 'scripts/validate_private_event.py'
      - 'scripts/private_journal.py'
      - 'tests/test_private_journal.py'
      - 'tests/test_validate_private_event.py'
      - 'docs/REPO_HYGIENE_DECISIONS.json'
      - 'portfolio-polish.css'
      - 'portfolio-shortcuts.js'
      - '.github/workflows/check-portfolio.yml'
  push:
    branches:
      - 'feat/portfolio-review-checkpoints-20261017'
    paths:
      - 'scripts/collect_portfolio.py'
      - 'tests/test_collect_portfolio.py'
      - 'docs/APP_PORTFOLIO.md'
      - 'docs/PORTFOLIO_REVIEW_CHECKPOINTS.json'
      - 'portfolio.html'
      - '.github/workflows/check-portfolio.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify public observation and review semantics
        run: python3 -m unittest discover -s tests -p 'test_collect_portfolio.py' -v
      - name: Validate offline public hygiene rules
        run: python3 -m unittest discover -s tests -p 'test_repo_hygiene.py' -v

      - name: Validate private-event schema offline only
        run: python3 -m unittest discover -s tests -p 'test_validate_private_event.py' -v

      - name: Validate private journal replay and idempotency
        run: python3 -m unittest discover -s tests -p 'test_private_journal.py' -v

      - name: Validate external UI JavaScript and accessibility hooks
        run: |
          node --check portfolio-ui.js
          node --check portfolio-shortcuts.js
          node --check repo-hygiene-ui.js
          python3 - <<'PY'
          from pathlib import Path
          html=Path('portfolio.html').read_text(encoding='utf-8')
          script=Path('portfolio-ui.js').read_text(encoding='utf-8')
          css=Path('portfolio-ui.css').read_text(encoding='utf-8')
          polish=Path('portfolio-polish.css').read_text(encoding='utf-8')
          shortcuts=Path('portfolio-shortcuts.js').read_text(encoding='utf-8')
          required=['id="list"','id="syncStatus"','id="pendingCount"','id="copyIntake"','id="stage"','id="sort"','id="search"']
          missing=[x for x in required if x not in html]
          if missing:
              raise SystemExit('Missing UI hooks: '+repr(missing))
          if 'portfolio-ui.js' not in html or 'portfolio-ui.css' not in html:
              raise SystemExit('External UI assets not loaded')
          if 'lastMovement' not in script or 'statusOf' not in script or 'app.next' not in script:
              raise SystemExit('Three-column content contract missing')
          if '@media(max-width:720px)' not in css or 'prefers-reduced-motion' not in css:
              raise SystemExit('Mobile or reduced-motion support missing')
          required_polish=['id="commandLauncher"','id="themeToggle"','portfolio-shortcuts.js','portfolio-polish.css']
          if any(x not in html for x in required_polish):
              raise SystemExit('Command launcher, toggle or assets missing')
          if 'setView:' not in script or 'focusApp:' not in script or 'getApps:' not in script:
              raise SystemExit('Navigation API for command menu missing')
          if 'openPalette' not in shortcuts or 'moveSelection' not in shortcuts or 'isTyping' not in shortcuts:
              raise SystemExit('Command palette or keyboard checks missing')
          if 'repo-hygiene-ui.js' not in html or 'id="repoHygiene"' not in html:
              raise SystemExit('Missing public hygiene view hooks')
          script_hygiene=Path('repo-hygiene-ui.js').read_text(encoding='utf-8')
          if 'repo-hygiene.json' not in script_hygiene or 'textContent' not in script_hygiene:
              raise SystemExit('Hygiene UI must use public snapshot and safe DOM insertion')
          if ':root[data-theme="dark"]' not in polish or 'prefers-reduced-motion' not in polish:
              raise SystemExit('Dark theme or motion reduction missing')
          for hook in ['id="copySessionStart"','id="copySessionCheckpoint"','id="copySessionResume"','id="copySessionEnd"','REPO_HYGIENE_20261017.md','CLOUD_SESSION_PROTOCOL.md']:
              if hook not in html:
                  raise SystemExit('Missing session audit tool hook: '+hook)
          for label in ['copySessionStart','copySessionCheckpoint','copySessionResume','copySessionEnd','attachCopy(','このアプリの引継ぎを復元']:
              if label not in script:
                  raise SystemExit('Missing session template wiring: '+label)
          protocol=Path('docs/CLOUD_SESSION_PROTOCOL.md').read_text(encoding='utf-8')
          audit=Path('docs/REPO_HYGIENE_20261017.md').read_text(encoding='utf-8')
          if 'started_at' not in protocol or 'ended_at' not in protocol or 'work_id' not in protocol:
              raise SystemExit('Lifecycle timestamp/ID contract missing')
          if '非公開Repoの名前' not in audit and '非公開のRepo名' not in audit:
              raise SystemExit('Public audit privacy note missing')

          PY
