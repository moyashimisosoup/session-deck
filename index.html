<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Session Deck: AI開発の作業とセッションを横断的に見渡すダッシュボード。">

</head>
<body>
  <div class="app-shell">

      <nav class="nav" id="mainNav">
        <button type="button" class="nav-item selected" data-view="overview"><span class="nav-icon">▦</span> 概要 <span class="nav-key">01</span></button>
        <button type="button" class="nav-item" data-view="works"><span class="nav-icon">▤</span> 作業一覧 <span class="nav-key">02</span></button>
        <button type="button" class="nav-item" data-view="sessions"><span class="nav-icon">▣</span> セッション <span class="nav-key">03</span></button>

        <a class="nav-item" href="./portfolio.html" style="text-decoration:none"><span class="nav-icon">▤</span> アプリ台帳 <span class="nav-key">05</span></a>

      </nav>
      <div class="sidebar-label second-label">PROJECTS</div>
      <div id="projectNav" class="project-nav"></div>
      </div>
      <div class="sidebar-bottom">

        <div class="identity"><div class="avatar">SD</div><div><strong>Local preview</strong><span>v0.1.0 · Browser only</span></div><span class="identity-dots">•••</span></div>
      </div>
    </aside>
    <div class="main-area">
      <header class="topbar">

      <main id="mainContent" tabindex="-1"></main>
      <footer class="app-footer"><span>SESSION DECK / PROTOTYPE 0.1</span><span>表示データは架空です。保存はこのブラウザ内のみ。</span></footer>

  <div id="drawerBackdrop" class="backdrop" hidden></div>
  <section id="detailDrawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden><div id="drawerContent"></div></section>
  <div id="modalBackdrop" class="modal-backdrop" hidden></div>
  <section class="modal" id="formModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden><div id="modalContent"></div></section>
  <div id="toast" role="status" aria-live="polite" class="toast" hidden></div>
<script defer src="./app.js"></script>
<script defer src="./motion.js"></script>
